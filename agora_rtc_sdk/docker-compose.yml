services:
  recorder:
    build: .
    image: agora-recorder:4.4.151
    container_name: agora_recorder

    network_mode: "host"
    shm_size: '2gb'

    env_file:
      - ./controller/.env

    volumes:
      - ./output:/app/output

    environment:
      NODE_ENV: production

    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

    restart: always

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

